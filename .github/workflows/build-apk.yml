name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Conectoma
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Conferir Android SDK disponivel
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Gerar debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar pyarrow e numpy
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyarrow numpy

      - name: "Extrair cérebro (metade das conexoes: pares com >= 2 sinapses)"
        run: |
          python tools/extract_connectome.py \
            --nodes data/nodes.parquet \
            --connections data/connections.parquet \
            --out app/src/main/assets/connectome/flywire_mb.bin \
            --stats tools/connectome_stats.json

      - name: Build APK (release, assinado com debug keystore)
        run: ./gradlew assembleRelease

      - name: Preparar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Conectoma-release.apk
          ls -lh out

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Conectoma-APK
          path: out/*.apk
          retention-days: 90

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: Conectoma ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
